# hyprlock.conf
# Script: ~/.config/hypr/hyprlock.sh
# Launch via: bash ~/.config/hypr/hyprlock.sh launch

general {
    hide_cursor = true
    ignore_empty_input = true
}

# ── Background ────────────────────────────────────────────────────────────────
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    contrast = 1.0
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# ── Avatar ────────────────────────────────────────────────────────────────────
image {
    monitor =
    path = /home/rjun/.config/face
    size = 80
    rounding = 12
    border_size = 2
    border_color = rgb(ffffff)
    position = 0, 220
    halign = center
    valign = center
}

# ── Clock ─────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(c0c0c0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

# ── Date ──────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%b %d, %a")"
    color = rgb(a0a0a0)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# ── Password field ────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(ffffff00)
    inner_color = rgba(0d0d0d00)
    font_color = rgb(c0c0c0)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text =
    hide_input = false
    rounding = 12
    check_color = rgba(ffffff55)
    fail_color = rgb(ff6b6b)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(ffcc00)
    position = 0, -60
    halign = center
    valign = center
}

# ══════════════════════════════════════════════════════════════════════════════
# Media Card
#
# Card: 380×114, centered at (0, -178)
#   → left edge  = -190
#   → right edge = +190
#
# Art: 80px, centered at (-130, -172)
#   → art spans x: -170 … -90  (safely inside left edge -190)
#
# Text column: left-aligned, anchor at (-80, *)  halign=left
#   Title   y = -158
#   Artist  y = -176
#   Controls row centered within right portion: x=20, y=-198
#
# ══════════════════════════════════════════════════════════════════════════════

# ── Card background ───────────────────────────────────────────────────────────
shape {
    monitor =
    size = 380, 114
    color = rgba(18181bcc)
    rounding = 18
    border_size = 1
    border_color = rgba(ffffff18)
    position = 0, -178
    halign = center
    valign = center
}

# ── Album art ─────────────────────────────────────────────────────────────────
# reload_time = 0 → only reloads on SIGUSR2 (sent by hyprlock.sh launch)
image {
    monitor =
    path = /tmp/hyprlock_album_art.png
    size = 100
    rounding = 10
    border_size = 0
    reload_time = 0
    position = -130, -177
    halign = center
    valign = center
}

# ── Track title ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:2000] bash /home/rjun/.config/hypr/hyprlock.sh title
    color = rgb(f0f0f0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 900, -158
    halign = left
    valign = center
}

# ── Artist name ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:2000] bash /home/rjun/.config/hypr/hyprlock.sh artist
    color = rgb(888888)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 910, -176
    halign = left
    valign = center
}

# ── Controls row (prev / playpause / next) ────────────────────────────────────
label {
    monitor =
    text = cmd[update:2000] bash /home/rjun/.config/hypr/hyprlock.sh prev
    color = rgb(909090)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -10, -198
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] bash /home/rjun/.config/hypr/hyprlock.sh playpause
    color = rgb(f0f0f0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 20, -198
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] bash /home/rjun/.config/hypr/hyprlock.sh next
    color = rgb(909090)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 50, -198
    halign = center
    valign = center
}

# ── Battery ───────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:30000] bash /home/rjun/.config/hypr/hyprlock.sh battery
    color = rgb(a0a0a0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -270
    halign = center
    valign = center
}

# ── Power options ─────────────────────────────────────────────────────────────
label {
    monitor =
    text = 󰤄    󰒲    󰜉    󰐥
    color = rgba(a0a0a055)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -315
    halign = center
    valign = center
}
