# hypridle.conf — idle-triggered lock/dpms only (NO auto-suspend)
# See https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
# Lock screen comes from Noctalia (noctalia msg session <action>), not hyprlock.
#
# Auto-suspend was deliberately removed: suspend/resume on this laptop
# (NVIDIA Optimus) has twice failed to come back cleanly after idle-triggered
# suspend, forcing a hard power-cycle (see journal around 2026-10-22 17:42
# and 2026-10-25 20:28 — suspend/resume itself looked clean at the
# kernel/ACPI/NVIDIA level, then the system went dark with no shutdown
# sequence logged at all). Suspend only via deliberate action now (wlogout),
# never unattended. Revisit if the underlying resume reliability is fixed.

general {
    lock_cmd         = noctalia msg session lock
    before_sleep_cmd = noctalia msg session lock
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# Lock after 5 minutes idle
listener {
    timeout    = 300
    on-timeout = noctalia msg session lock
}

# Screen off after 7 minutes idle (no suspend — just DPMS off)
listener {
    timeout    = 420
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
