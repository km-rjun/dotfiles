# hypridle.conf — idle-triggered lock/dpms/suspend
# See https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
# Lock screen comes from Noctalia (noctalia msg session <action>), not hyprlock.

general {
    lock_cmd         = noctalia msg session lock
    before_sleep_cmd = noctalia msg session lock
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# Lock after 5 minutes idle
listener {
    timeout    = 300
    on-timeout = noctalia msg session lock
}

# Screen off after 7 minutes idle
listener {
    timeout    = 420
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Lock + suspend after 20 minutes idle
listener {
    timeout    = 1200
    on-timeout = noctalia msg session lock-and-suspend
}
